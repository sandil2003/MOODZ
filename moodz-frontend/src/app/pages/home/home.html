<div class="home-container">
    <header class="header">
        <div class="logo-container">
            <h1 class="logo">MOODZ</h1>
            <div class="shape shape-6"></div>
        </div>
    </header>

    <main class="main-content">
        <!-- Decorative shapes -->
        <div class="shape shape-1" (mousedown)="onMouseDown($event, 0)"></div>
        <div class="shape shape-2" (mousedown)="onMouseDown($event, 1)"></div>
        <div class="shape shape-3" (mousedown)="onMouseDown($event, 2)"></div>
        <div class="shape shape-4" (mousedown)="onMouseDown($event, 3)"></div>

        <!-- Main card -->
        <div class="card">
            <h2 class="title">Mood Agent</h2>
            <p class="description">
                An AI companion to help you understand and navigate your feelings.
            </p>
            <button class="activate-btn" (click)="activateAgent()">
                Activate Agent
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </main>
</div>

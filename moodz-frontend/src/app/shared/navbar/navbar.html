<header class="header" [ngClass]="{'header-mood-dashboard': isOnMoodDashboard()}">
    <div class="header-content">
        <div class="logo-container">
            <h1 class="logo">
                <a routerLink="/" class="logo-link" (mouseenter)="showTooltip(2)" (mouseleave)="hideTooltip(2)"
                    (click)="hideTooltip(2)">
                    MOODZ
                    <div class="tooltip logo-tooltip" [class.visible]="tooltipVisible()[2]">
                        {{ tooltipText()[2] }}
                    </div>
                </a>
            </h1>
            <div class="rectangle"></div>
        </div>

        <!-- Header Icons -->
        <div class="header-icons">
            <a routerLink="/mood-history" class="icon-button" (mouseenter)="showTooltip(0)"
                (mouseleave)="hideTooltip(0)" (click)="hideTooltip(0)">
                <span class="material-icons">insights</span>
                <div class="tooltip" [class.visible]="tooltipVisible()[0]">
                    {{ tooltipText()[0] }}
                </div>
            </a>
            <button class="icon-button" (mouseenter)="showTooltip(1)" (mouseleave)="hideTooltip(1)"
                (click)="toggleDarkMode(); hideTooltip(1)">
                <span class="material-icons">dark_mode</span>
                <div class="tooltip" [class.visible]="tooltipVisible()[1]">
                    {{ tooltipText()[1] }}
                </div>
            </button>
        </div>
    </div>
</header>

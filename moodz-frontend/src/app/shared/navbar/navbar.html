<header class="header"
    [ngClass]="{'header-mood-dashboard': isOnMoodDashboard(), 'header-home-page': isOnHomePage(), 'header-mood-agent': isOnMoodAgent(), 'header-about-us': isOnAboutUs()}">
    <div class="header-content">
        <!-- Hamburger Menu Button (Mobile Only) -->
        <button class="hamburger-menu" (click)="toggleMobileMenu()" [class.active]="mobileMenuOpen()"
            aria-label="Toggle menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <!-- Navigation Links (Desktop) -->
        <nav class="nav-links desktop-nav">
            <a routerLink="/" class="nav-link" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/about-us" class="nav-link" routerLinkActive="active">About Us</a>
        </nav>

        <!-- Header Icons -->
        <div class="header-icons">
            @if (!isOnHomePage()) {
            <a routerLink="/mood-dashboard" class="icon-button" (mouseenter)="showTooltip(0)"
                (mouseleave)="hideTooltip(0)" (click)="hideTooltip(0)">
                <span class="material-icons">insights</span>
                <div class="tooltip" [class.visible]="tooltipVisible()[0]">
                    {{ tooltipText()[0] }}
                </div>
            </a>
            }
            <button class="icon-button" (mouseenter)="showTooltip(1)" (mouseleave)="hideTooltip(1)"
                (click)="toggleDarkMode(); hideTooltip(1)">
                <span class="material-icons">dark_mode</span>
                <div class="tooltip" [class.visible]="tooltipVisible()[1]">
                    {{ tooltipText()[1] }}
                </div>
            </button>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" [class.active]="mobileMenuOpen()" (click)="closeMobileMenu()"></div>

    <!-- Mobile Menu -->
    <nav class="mobile-menu" [class.active]="mobileMenuOpen()">
        <a routerLink="/" class="mobile-nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
            (click)="closeMobileMenu()">
            <span class="material-icons">home</span>
            Home
        </a>
        <a routerLink="/about-us" class="mobile-nav-link" routerLinkActive="active" (click)="closeMobileMenu()">
            <span class="material-icons">info</span>
            About Us
        </a>
        @if (!isOnHomePage()) {
        <a routerLink="/mood-dashboard" class="mobile-nav-link" routerLinkActive="active" (click)="closeMobileMenu()">
            <span class="material-icons">insights</span>
            Mood Dashboard
        </a>
        }
    </nav>
</header>

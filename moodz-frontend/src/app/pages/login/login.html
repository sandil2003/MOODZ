<div class="auth-page">
    <!-- Animated Background -->
    <div class="auth-bg">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card" id="login-card">
        <!-- Header -->
        <div class="auth-header">
            <a routerLink="/" class="auth-logo">MOODZ</a>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to continue your journey</p>
        </div>

        <!-- Error -->
        @if (error()) {
        <div class="auth-error" id="login-error">
            <span class="material-symbols-outlined">error</span>
            <span>{{ error() }}</span>
        </div>
        }

        <!-- Form -->
        <form class="auth-form" (submit)="$event.preventDefault(); onSubmit()">
            <div class="form-group">
                <label class="form-label" for="login-email">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon material-symbols-outlined">mail</span>
                    <input type="email" id="login-email" class="form-input" placeholder="you@example.com"
                        [ngModel]="email()" (ngModelChange)="email.set($event)" (keypress)="onKeyPress($event)"
                        name="email" autocomplete="email" />
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon material-symbols-outlined">lock</span>
                    <input [type]="showPassword() ? 'text' : 'password'" id="login-password" class="form-input"
                        placeholder="Enter your password" [ngModel]="password()"
                        (ngModelChange)="password.set($event)" (keypress)="onKeyPress($event)" name="password"
                        autocomplete="current-password" />
                    <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
                        <span class="material-symbols-outlined">
                            {{ showPassword() ? 'visibility_off' : 'visibility' }}
                        </span>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-submit" [disabled]="isLoading()" id="login-submit-btn">
                @if (isLoading()) {
                <span class="spinner"></span>
                Signing in...
                } @else {
                Sign In
                <span class="material-symbols-outlined">arrow_forward</span>
                }
            </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <span>Don't have an account?</span>
            <a routerLink="/register" class="auth-link">Create one</a>
        </div>
    </div>
</div>

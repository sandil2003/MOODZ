version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moodz_postgres_dev
    env_file:
      - "./MOOD AI AGENT/.env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-moodz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodz_dev_network

  redis:
    image: redis:7-alpine
    container_name: moodz_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodz_dev_network

  backend:
    build:
      context: "./MOOD AI AGENT"
      dockerfile: Dockerfile.dev
    container_name: moodz_backend_dev
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    env_file:
      - "./MOOD AI AGENT/.env"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "./MOOD AI AGENT:/app"
      # Prevent the container's node_modules or venv from being overwritten by host
    networks:
      - moodz_dev_network

  frontend:
    build:
      context: "./moodz-frontend"
      dockerfile: Dockerfile.dev
    container_name: moodz_frontend_dev
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - "./moodz-frontend:/app"
      - "/app/node_modules"
    networks:
      - moodz_dev_network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  moodz_dev_network:
    driver: bridge
